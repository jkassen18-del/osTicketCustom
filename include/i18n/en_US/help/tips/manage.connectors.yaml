#
# This is popup help messages for the Admin Panel -> Manage -> Connectors
#
# Fields:
# title - Shown in bold at the top of the popover window
# content - The body of the help popover
# links - List of links shows below the content
#   title - Link title
#   href - href of link (links starting with / are translated to the
#       helpdesk installation path)
#
# The key names such as 'helpdesk_name' should not be translated as they
# must match the HTML #ids put into the page template.
#
---
connectors:
    title: Connectors
    content: >
        Connectors integrate the help desk with the systems where your
        teams already work. Each connector maps one or more
        <span class="doc-desc-title">channels</span> (a Linear team, a
        Microsoft Teams channel, a webhook routing key) to a
        <span class="doc-desc-title">department</span>. Tickets created
        in a channel are routed to the mapped department and ticket
        activity, SLA escalations and monitored incidents are pushed
        back to the channel.
    links:
      - title: Integration guide
        href: /docs/INTEGRATIONS.md

directions:
    title: Directions
    content: >
        <span class="doc-desc-opt">Inbound</span> accepts events from the
        external system (new issues, comments or chat commands become
        tickets and replies). <span class="doc-desc-opt">Outbound</span>
        pushes new tickets, messages and replies to the channel.
        <span class="doc-desc-opt">Alerts</span> delivers SLA escalations
        and incident notifications. Mirroring close / reopen keeps both
        systems in the same state.

channel:
    title: Channel
    content: >
        A channel is one place in the external system: a Linear team
        (key or ID), a Teams channel ID, or a routing key sent by a
        webhook client. Flag a channel as <span class="doc-desc-opt">default</span>
        to catch activity of departments that have no mapping of their own.
